# FinRisk Lab - Unified Multi-Service Docker Architecture
#
#   docker compose up -d --build
#
# Services:
#   - dashboard:  http://localhost:8501   (Streamlit Institutional Platform)
#   - api:        http://localhost:8000/docs (FastAPI Scoring & Underwriting Service)
#   - mlflow:     http://localhost:5000   (MLflow Model Registry)
#   - postgres:   localhost:5432          (PostgreSQL Database)
name: finrisk

services:
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: finrisk-dashboard
    environment:
      FINRISK_REPORTS_DIR: /app/reports
    ports:
      - "8501:8501"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: finrisk-api
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-finrisk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finrisk}
      POSTGRES_DB: ${POSTGRES_DB:-finrisk}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: finrisk-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finrisk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finrisk}
      POSTGRES_DB: ${POSTGRES_DB:-finrisk}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb/00_create_mlflow_db.sql:/docker-entrypoint-initdb.d/00_create_mlflow_db.sql:ro
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finrisk} -d ${POSTGRES_DB:-finrisk}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    container_name: finrisk-mlflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "*"
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER:-finrisk}:${POSTGRES_PASSWORD:-finrisk}@postgres:5432/mlflow
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    restart: unless-stopped

volumes:
  pgdata:
  mlflow_artifacts:
